version: 2

before:
  hooks:
    - bash scripts/release-helpers-check.sh

builds:
  - id: proton-cli
    binary: proton-cli
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Drop windows/arm64 - we don't ship a helper for it (limited
      # webview_go support; can be added later by extending the
      # workflow matrix and adding internal/hv/embed_windows_arm64.go).
      - goos: windows
        goarch: arm64
    flags:
      - -tags=embed_hv
    ldflags:
      - -s -w -X github.com/roman-16/proton-cli/internal/cli.version={{.Version}}

archives:
  - formats: [binary]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc

release:
  draft: false
