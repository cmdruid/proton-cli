version: 2

before:
  hooks:
    - bash scripts/release-helpers-check.sh
    - bash scripts/gen-completions.sh

builds:
  - id: proton-cli
    binary: proton-cli
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Drop windows/arm64 - we don't ship a helper for it (limited
      # webview_go support; can be added later by extending the
      # workflow matrix and adding internal/hv/embed_windows_arm64.go).
      - goos: windows
        goarch: arm64
    flags:
      - -tags=embed_hv
    ldflags:
      - -s -w -X github.com/roman-16/proton-cli/internal/cli.version={{.Version}}

archives:
  - id: binary
    formats: [binary]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
  # tar.gz (linux only) bundling the binary, license, and completions.
  # Consumed by the AUR -bin package; the raw binaries above stay for
  # the documented direct download.
  - id: archive
    ids: [proton-cli]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - completions/*
    format_overrides:
      - goos: darwin
        formats: [none]
      - goos: windows
        formats: [none]

nfpms:
  - ids: [proton-cli]
    package_name: proton-cli
    formats: [apk, deb, rpm]
    maintainer: "Roman <roman@lerchster.dev>"
    homepage: "https://github.com/roman-16/proton-cli"
    description: "An unofficial command-line tool for Proton - Mail, Drive, Calendar, Pass, and Contacts from your terminal, with real end-to-end encryption."
    license: MIT
    bindir: /usr/bin
    contents:
      - src: ./completions/proton-cli.bash
        dst: /usr/share/bash-completion/completions/proton-cli
      - src: ./completions/proton-cli.fish
        dst: /usr/share/fish/vendor_completions.d/proton-cli.fish
      - src: ./completions/proton-cli.zsh
        dst: /usr/share/zsh/site-functions/_proton-cli
      - src: ./LICENSE
        dst: /usr/share/doc/proton-cli/copyright
        packager: deb
      - src: ./LICENSE
        dst: /usr/share/licenses/proton-cli/LICENSE
        packager: rpm
    # The main binary is static (CGO-free). webkit2gtk/gtk3 are only
    # pulled in by the embedded CAPTCHA helper, so they are optional
    # (recommends), never hard dependencies - the CLI runs headless
    # without them.
    overrides:
      deb:
        recommends:
          - libgtk-3-0t64 | libgtk-3-0
          - libwebkit2gtk-4.1-0
      rpm:
        recommends:
          - gtk3
          - webkit2gtk4.1

aurs:
  - name: proton-cli-bin
    ids: [archive]
    homepage: "https://github.com/roman-16/proton-cli"
    description: "An unofficial command-line tool for Proton - Mail, Drive, Calendar, Pass, and Contacts from your terminal, with real end-to-end encryption."
    maintainers:
      - "Roman <roman@lerchster.dev>"
    license: MIT
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: "ssh://aur@aur.archlinux.org/proton-cli-bin.git"
    optdepends:
      - "gtk3: CAPTCHA/human-verification webview"
      - "webkit2gtk-4.1: CAPTCHA/human-verification webview"
    package: |-
      install -Dm755 "./proton-cli" "${pkgdir}/usr/bin/proton-cli"
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/proton-cli-bin/LICENSE"
      install -Dm644 "./completions/proton-cli.bash" "${pkgdir}/usr/share/bash-completion/completions/proton-cli"
      install -Dm644 "./completions/proton-cli.fish" "${pkgdir}/usr/share/fish/vendor_completions.d/proton-cli.fish"
      install -Dm644 "./completions/proton-cli.zsh"  "${pkgdir}/usr/share/zsh/site-functions/_proton-cli"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc

release:
  draft: false
  # Replace existing assets on re-run so a partial failure (e.g. a
  # transient AUR/apt hiccup) can be retried without 422 already_exists.
  mode: replace
